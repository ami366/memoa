<script>
(function(){

}

function renderCards(){
 var a=visible();

  var locked=catLocked(n.category)||noteLocked(n),open=selected===n.id;
  var prev=locked?"ロックされています":(n.hidden?"••••••••":String(n.content||"").replace(/\s+/g," "));
  var detail="";

   detail='<div class="inlineDetail">'+
    '<div class="inlineText">'+(locked?
      'このメモはロックされています。<br><button class="secondary inlineOpen" data-open="'+n.id+'">'+svg("lock")+' PINを入力して表示</button>':
      (n.hidden?'••••••••••••':esc(n.content)))+'</div>'+
    '<div class="inlineBar">'+
      '<span class="inlineCat">'+svg("folder")+esc(n.category)+'</span>'+
      '<div class="inlineActions">'+

       '<button class="inlineBtn '+(n.lockPin?"active":"")+'" data-lock="'+n.id+'" title="ロック">'+svg(n.lockPin?"lock":"unlock")+'</button>'+
       '<button class="inlineBtn" data-edit="'+n.id+'" title="編集">'+svg("edit")+'</button>'+

      '</div></div></div>';
  }

   '<div class="cardtop"><div class="cardicon" style="background:'+esc(cat(n.category).color)+'77">'+svg("doc")+'</div>'+
   '<div class="cardmain"><div class="cardtitle">'+esc(n.title)+'</div><div class="cardpreview">'+
   (locked?'<span class="smallsvg lockinline">'+svg("lock")+'</span> ':"")+esc(prev)+'</div><div class="cardmeta">'+esc(n.category)+'</div></div>'+
   '<div class="cardactions"><button class="action copy" data-copy="'+n.id+'" title="コピー">'+svg("copy")+'</button><button class="action pin '+(n.pinned?"active":"")+'" data-pin="'+n.id+'" title="ピン留め">'+svg("pin")+'</button></div></div>'+

  }

 Array.prototype.forEach.call(E("cards").querySelectorAll("[data-open]"),function(b){b.onclick=function(){var n=find(b.getAttribute("data-open"));access(n,function(){render()})}});
 Array.prototype.forEach.call(E("cards").querySelectorAll("[data-hide]"),function(b){b.onclick=function(){var n=find(b.getAttribute("data-hide"));access(n,function(){n.hidden=!n.hidden;save();render()})}});
 Array.prototype.forEach.call(E("cards").querySelectorAll("[data-lock]"),function(b){b.onclick=function(){var n=find(b.getAttribute("data-lock"));catAccess(n.category,function(){toggleLock(n)})}});
 Array.prototype.forEach.call(E("cards").querySelectorAll("[data-edit]"),function(b){b.onclick=function(){var n=find(b.getAttribute("data-edit"));access(n,function(){openEditor(n)})}});
 Array.prototype.forEach.call(E("cards").querySelectorAll("[data-delete]"),function(b){b.onclick=function(){var n=find(b.getAttribute("data-delete"));access(n,function(){if(confirm("「"+n.title+"」を削除しますか？")){notes=notes.filter(function(x){return x.id!==n.id});trash.unshift(n);selected=null;save();render()}})}});
}
function find(i){return notes.find(function(n){return n.id===i})}
function render(){renderNav();renderCards()}
function copyNote(n){if(!n)return;access(n,function(){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(n.content).then(function(){toast("コピーしました")}).catch(function(){fallback(n.content)});else fallback(n.content)})}
function fallback(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("コピーしました")}catch(e){prompt("コピーしてください",t)}a.remove()}
function toggleLock(n){if(n.lockPin){var p=prompt("現在のPINを入力してください");if(p===n.lockPin&&confirm("個別ロックを解除しますか？")){delete n.lockPin;n._unlocked=false;save();render()}else if(p!==null&&p!==n.lockPin)toast("PINが違います")}else{var p=prompt("PINを設定してください（4文字以上）");if(p===null)return;if(p.length<4){toast("4文字以上にしてください");return}var p2=prompt("同じPINをもう一度入力してください");if(p===p2){n.lockPin=p;n._unlocked=false;save();render()}else toast("PINが一致しません")}}
function openEditor(n){editing=n?n.id:null;E("formTitle").textContent=n?"メモを編集":"新しいメモ";E("title").value=n?n.title:"";E("content").value=n?n.content:"";E("category").innerHTML=cats.map(function(c){return'<option>'+esc(c.name)+'</option>'}).join("");if(n)E("category").value=n.category;E("editor").classList.add("show")}
E("form").onsubmit=function(e){e.preventDefault();var t=E("title").value.trim(),c=E("content").value.trim(),ca=E("category").value;if(!t||!c)return;if(editing){var n=find(editing);n.title=t;n.content=c;n.category=ca}else{var n={id:id(),title:t,content:c,category:ca,created:Date.now(),pinned:false,hidden:false};notes.unshift(n);selected=n.id}save();E("editor").classList.remove("show");editing=null;render();toast("保存しました ✓")};
function renderCats(){E("catList").innerHTML=cats.map(function(c,i){return'<div class="catrow" data-catrow="'+i+'"><span class="draghandle" data-drag="'+i+'" title="長押しして並べ替え">≡</span><span class="dot" style="background:'+esc(c.color)+'"></span><span class="name">'+esc(c.name)+'</span><input type="color" value="'+esc(c.color)+'" data-color="'+i+'" style="width:38px;height:31px"><button class="secondary" data-cedit="'+i+'" title="カテゴリー名を変更">編集</button><button class="secondary" data-clock="'+i+'" title="カテゴリーロック">'+svg(c.lockPin?"lock":"unlock")+'</button><button class="danger" data-cdel="'+i+'">削除</button></div>'}).join("");Array.prototype.forEach.call(E("catList").querySelectorAll("[data-color]"),function(x){x.oninput=function(){cats[+x.getAttribute("data-color")].color=x.value;save();render()}});Array.prototype.forEach.call(E("catList").querySelectorAll("[data-cedit]"),function(b){b.onclick=function(){renameCat(+b.getAttribute("data-cedit"))}});Array.prototype.forEach.call(E("catList").querySelectorAll("[data-clock]"),function(b){b.onclick=function(){toggleCat(+b.getAttribute("data-clock"))}});Array.prototype.forEach.call(E("catList").querySelectorAll("[data-cdel]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-cdel"),c=cats[i];if(notes.some(function(n){return n.category===c.name})){toast("使用中のカテゴリーです");return}if(cats.length>1&&confirm("削除しますか？")){cats.splice(i,1);save();renderCats();render()}}});setupCatDrag()}
function setupCatDrag(){Array.prototype.forEach.call(E("catList").querySelectorAll("[data-drag]"),function(h){var row=h.closest(".catrow"),timer=null,active=false,startY=0,currentIndex=+h.getAttribute("data-drag");function begin(){active=true;row.classList.add("dragging");if(navigator.vibrate)navigator.vibrate(25)}function moveAt(y){var target=document.elementFromPoint(window.innerWidth/2,y);if(!target)return;target=target.closest(".catrow");if(!target||target===row||target.parentNode!==E("catList"))return;var rows=Array.prototype.slice.call(E("catList").children),targetIndex=rows.indexOf(target);if(targetIndex<0||targetIndex===currentIndex)return;var item=cats.splice(currentIndex,1)[0];cats.splice(targetIndex,0,item);if(targetIndex>currentIndex)E("catList").insertBefore(row,target.nextSibling);else E("catList").insertBefore(row,target);currentIndex=targetIndex}h.addEventListener("touchstart",function(e){if(e.touches.length!==1)return;startY=e.touches[0].clientY;timer=setTimeout(begin,160)},{passive:true});h.addEventListener("touchmove",function(e){var y=e.touches[0].clientY;if(!active&&Math.abs(y-startY)>18){clearTimeout(timer);timer=null;return}if(active){e.preventDefault();moveAt(y)}},{passive:false});function finish(){clearTimeout(timer);timer=null;if(active){active=false;row.classList.remove("dragging");save();renderCats();render();toast("カテゴリーの順番を変更しました ✓")}}h.addEventListener("touchend",finish);h.addEventListener("touchcancel",finish);h.draggable=true;h.addEventListener("dragstart",function(e){active=true;row.classList.add("dragging");e.dataTransfer.effectAllowed="move"});h.addEventListener("dragend",finish);row.addEventListener("dragover",function(e){if(!active)return;e.preventDefault();moveAt(e.clientY)})})}
function moveCat(i,d){var j=i+d;if(j<0||j>=cats.length)return;var x=cats[i];cats[i]=cats[j];cats[j]=x;save();renderCats();render();toast("カテゴリーの順番を変更しました ✓")}
function renameCat(i){var c=cats[i],oldName=c.name,newName=prompt("カテゴリー名を変更",oldName);if(newName===null)return;newName=newName.trim();if(!newName||newName===oldName)return;if(newName==="すべて"){toast("「すべて」は使用できません");return}if(cats.some(function(x,j){return j!==i&&x.name===newName})){toast("同じカテゴリーがあります");return}notes.forEach(function(n){if(n.category===oldName)n.category=newName});trash.forEach(function(n){if(n.category===oldName)n.category=newName});c.name=newName;if(filter===oldName)filter=newName;save();renderCats();render();toast("カテゴリー名を変更しました")}
function toggleCat(i){var c=cats[i];if(c.lockPin){var p=prompt("現在のPINを入力してください");if(p===c.lockPin&&confirm("カテゴリーロックを解除しますか？")){delete c.lockPin;c._unlocked=false;save();renderCats();render()}else if(p!==null&&p!==c.lockPin)toast("PINが違います")}else{var p=prompt("カテゴリーPINを設定（4文字以上）");if(p===null)return;if(p.length<4){toast("4文字以上にしてください");return}var p2=prompt("同じPINをもう一度");if(p===p2){c.lockPin=p;c._unlocked=false;save();renderCats();render()}else toast("PINが一致しません")}}
E("newBtn").onclick=function(){openEditor(null)};E("cancel").onclick=function(){E("editor").classList.remove("show")};E("search").oninput=render;E("sortBtn").onclick=function(){sortMode=(sortMode+1)%3;toast(["ピン優先・新しい順","新しい順","タイトル順"][sortMode]);render()};E("settingsBtn").onclick=function(){renderCats();E("settings").classList.add("show")};E("closeSettings").onclick=function(){E("settings").classList.remove("show")};E("addCat").onclick=function(){var n=E("newCat").value.trim();if(!n)return;if(cats.some(function(c){return c.name===n})){toast("同じカテゴリーがあります");return}var colors=["#f6d6e3","#e5daf7","#d7ecf6","#dff1df","#f7e5c9"];cats.push({name:n,color:colors[cats.length%colors.length]});E("newCat").value="";save();renderCats();render()};E("trashBtn").onclick=function(){if(!trash.length){toast("削除済みメモはありません");return}var names=trash.map(function(n,i){return(i+1)+". "+n.title}).join("\n");if(confirm("削除済みメモ "+trash.length+"件\n\n"+names+"\n\nすべて復元しますか？")){notes=trash.concat(notes);trash=[];save();render();E("settings").classList.remove("show")}};
